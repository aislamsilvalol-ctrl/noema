# CI-only override: no --reload.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
#
# Written while chasing issue #22 (intermittent read-after-write in the compose
# smoke test) to rule the uvicorn reloader in or out. The cause turned out to be
# elsewhere -- FastAPI's default "request" scope for dependencies with yield
# committed the session after the response had been sent; see
# apps/api/noema/api/v1/deps.py -- but the override stays: the smoke never edits
# code, so hot-reload buys CI nothing, only a file watcher on a bind mount. Local
# development keeps --reload: this file is CI-only, not a change to
# docker-compose.yml.

services:
  api:
    command: >
      sh -c "alembic upgrade head &&
             uvicorn noema.main:app --host 0.0.0.0 --port 8000"
