# The only container on the boundary in local mode.
#
# A container attached solely to an `internal: true` network cannot publish a port —
# it is unreachable from the host, which makes the app private and unusable at once.
# So the API stays on the closed network and this forwards to it. The proxy holds no
# data, no keys and no state; it makes no outbound connection of its own.

server {
    listen 8000;
    server_name _;

    # Uploads. Must not be smaller than NOEMA_MAX_UPLOAD_MB, or the proxy rejects
    # documents the API would have accepted — with a different error, from a
    # different place, for no reason the user can see.
    client_max_body_size 128m;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Set, but deliberately *not* trusted by the API: a client can send its own
        # X-Forwarded-For, so trusting it would let anyone pick their rate-limit
        # bucket. The consequence is that unauthenticated requests all share one
        # bucket here. On a single-machine local install that is nobody else's
        # problem; on a shared deployment, terminate at a proxy you control and
        # configure the trust explicitly.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The tutor answers over SSE. With buffering on, nginx holds the tokens and
        # delivers the whole reply at once — the stream still "works" and the entire
        # point of it is gone.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
