name: noema

x-api-base: &api-base
  build:
    context: ./apps/api
    dockerfile: Dockerfile
  env_file: [.env]
  volumes:
    - ./apps/api:/app
    - uploads:/var/lib/noema/uploads
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema
      POSTGRES_DB: noema
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api-base
    command: >
      sh -c "alembic upgrade head &&
             uvicorn noema.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]

  worker:
    <<: *api-base
    # Ingestion and parsing run here, isolated from the request path and capped.
    command: dramatiq noema.workers --processes 2 --threads 4
    mem_limit: 2g
    # The worker shares the api image but not its HTTP server, so it cannot answer
    # the image's healthcheck. What actually matters for a worker is whether it can
    # reach the broker.
    healthcheck:
      test:
        ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file: [.env]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  uploads:

# Local mode: `NOEMA_MODE=local docker compose up`.
# Egress blocking for the api/worker containers is applied by
# docker-compose.local.yml, which attaches them to an internal-only network.
