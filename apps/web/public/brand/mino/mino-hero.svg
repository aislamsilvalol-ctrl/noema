<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="presentation">
  <!-- PLACEHOLDER. Not final art — see MINO_ASSETS.md at the repo root
       before treating this as brand-representative. A hand-authored stand-in
       with real pose/expression per state, still explicitly not commissioned
       character art. Body/hoodie/emblem/tuft are the shared shape reused
       across all six states; eyes, mouth and limbs are what differ here.
       Sweatshirt in the confirmed brand accent (#B5450C). -->
  <defs>
    <clipPath id="bodyClip">
      <path d="M240 110 C 330 110 372 185 372 270 C 372 355 315 415 240 415 C 165 415 108 355 108 270 C 108 185 150 110 240 110 Z"/>
    </clipPath>
  </defs>

  <!-- body -->
  <path d="M240 110 C 330 110 372 185 372 270 C 372 355 315 415 240 415 C 165 415 108 355 108 270 C 108 185 150 110 240 110 Z"
        fill="#e6e3de" stroke="#a8a29a" stroke-width="3"/>
  <g clip-path="url(#bodyClip)">
