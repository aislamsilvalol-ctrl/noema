    <ellipse cx="200" cy="160" rx="35" ry="20" fill="#fbfaf9" opacity="0.5"/>
    <!-- hoodie -->
    <rect x="90" y="290" width="300" height="140" fill="#b5450c"/>
    <ellipse cx="240" cy="292" rx="55" ry="14" fill="#963708"/>
  </g>

  <!-- chest emblem -->
