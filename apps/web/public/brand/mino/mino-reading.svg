<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="presentation">
  <!-- PLACEHOLDER. Not final art — see MINO_ASSETS.md at the repo root
       before treating this as brand-representative. Reading pose: downcast
       gaze, a held book, slight forward lean. Shared body/hoodie/emblem/tuft
       base as every other state; see mino-hero.svg for that shape's notes. -->
  <defs>
    <clipPath id="bodyClip">
      <path d="M240 110 C 330 110 372 185 372 270 C 372 355 315 415 240 415 C 165 415 108 355 108 270 C 108 185 150 110 240 110 Z"/>
    </clipPath>
  </defs>

  <g transform="rotate(-5 240 265)">
    <path d="M240 110 C 330 110 372 185 372 270 C 372 355 315 415 240 415 C 165 415 108 355 108 270 C 108 185 150 110 240 110 Z"
          fill="#e6e3de" stroke="#a8a29a" stroke-width="3"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="240" cy="330" rx="120" ry="70" fill="#d1cdc6" opacity="0.35"/>
      <ellipse cx="200" cy="160" rx="35" ry="20" fill="#fbfaf9" opacity="0.5"/>
      <rect x="90" y="290" width="300" height="140" fill="#b5450c"/>
      <ellipse cx="240" cy="292" rx="55" ry="14" fill="#963708"/>
