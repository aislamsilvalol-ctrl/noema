[project]
name = "noema-api"
version = "0.0.0"
description = "NOEMA — open-source adaptive AI learning platform (API and engines)"
readme = "../../README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "dramatiq[redis]>=1.17",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "httpx>=0.27",
  "python-multipart>=0.0.17",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "trafilatura>=1.12",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noema"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "dramatiq.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "evals: prompt and extraction quality checks, run against a mock provider in CI",
]
