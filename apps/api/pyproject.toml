[project]
name = "noema-api"
version = "0.0.0"
description = "NOEMA — open-source adaptive AI learning platform (API and engines)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
  # Pinned to the exact set of a verified green build. Everything here floated
  # before, so a build that was green yesterday could break today with no code
  # change — and did, across a Starlette major version. Upgrades are now a
  # deliberate commit with a CI run attached, which is the point.
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.1",
  "pydantic[email]==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg==0.31.0",
  "alembic==1.19.1",
  "pgvector==0.5.0",
  "redis==8.1.0",
  "dramatiq[redis]==2.2.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "structlog==26.1.0",
  # Document parsing. Imported lazily inside their parsers so a missing optional
  # dependency degrades one format rather than stopping the API from starting.
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
  "trafilatura==2.2.0",
]


[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.165.3",
  "mypy==2.3.0",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noema"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101",  # assert is fine in tests
  # Application errors are named after the condition, not the class hierarchy:
  # `raise NotFound(...)` and `raise Forbidden(...)` read as the HTTP semantics they
  # carry. An `Error` suffix on every one of them adds noise, not information.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Alembic exposes `op` and `context` as runtime proxies that mypy cannot resolve,
# and migrations are immutable historical artefacts rather than maintained code.
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "dramatiq.*", "trafilatura.*", "pymupdf.*", "docx.*", "katex.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dramatiq ships no type information: `actor` is an untyped decorator and
# RedisBroker an untyped constructor. Neither says anything about our own code.
module = ["noema.workers", "noema.ingestion.parsers.documents"]
disallow_untyped_decorators = false
# Third-party document libraries expose untyped constructors (docx.Document,
# pymupdf.open, RedisBroker). The wrappers around them are fully typed; this
# only stops mypy reporting the vendors' missing annotations as ours.
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "evals: prompt and extraction quality checks, run against a mock provider in CI",
]
