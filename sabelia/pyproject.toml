[project]
name = "sabelia"
version = "0.1.0"
description = "Adaptive Neural Learner Modeling Engine: knowledge, retention, uncertainty and the next learning action, from learning events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NOEMA" }]
keywords = ["knowledge-tracing", "learner-modeling", "spaced-repetition", "education", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Education",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
data = ["pandas>=2.1"]
service = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff==0.16.6", "scikit-learn>=1.4", "pandas>=2.1", "httpx>=0.27"]

[project.scripts]
sabelia = "sabelia.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sabelia*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# Matrices and model parameters keep their mathematical names (X, Y, L0, T, G, S).
ignore = ["N806", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["sabelia"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
