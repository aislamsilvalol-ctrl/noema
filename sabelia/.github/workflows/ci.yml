name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: lint · tests · quick benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (CPU torch)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: lint
        run: |
          .venv/bin/ruff check sabelia tests scripts
          .venv/bin/ruff format --check sabelia tests scripts
      - name: tests
        run: .venv/bin/pytest -p no:warnings
      - name: the pipeline runs end to end
        run: .venv/bin/sabelia benchmark --dataset configs/datasets/synthetic-small.yaml --quick --out /tmp/runs
