name: Bug report
description: Something behaves incorrectly
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability?** Do not file it here — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a notebook with …
        2. Upload …
        3. Ask …
    validations: { required: true }

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion / parsing
        - Retrieval / RAG / citations
        - Knowledge graph / concepts
        - Flashcards / FSRS
        - Questions / grading / exams
        - Mastery / learning engine
        - AI providers / BYOK
        - Web UI
        - Deployment / Docker
        - Other
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations: { required: true }

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [cloud, local]
    validations: { required: true }

  - type: input
    id: provider
    attributes:
      label: AI provider and model
      placeholder: ollama / llama3.1 — leave blank if not relevant

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs`. **Redact any API keys.**
      render: shell
