name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api:
    name: api · lint · types · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

      - name: the committed API schema is current
        # A schema in git is only useful if it is true. Regenerating and diffing
        # turns "someone forgot to run the script" into a red build rather than a
        # frontend that compiles against an API that no longer exists.
        run: |
          uv run bash ../../scripts/openapi.sh
          git diff --exit-code ../../openapi.json \
            || { echo "openapi.json is stale — run scripts/openapi.sh" >&2; exit 1; }

      - name: migrate
        env:
          DATABASE_URL: postgresql+asyncpg://noema:noema@localhost:5432/noema_test
        # Applying the migration against real Postgres with pgvector is the only way
        # to know it works; rendered SQL proves the Python runs, not that the server
        # accepts it. `alembic check` then fails if the models have drifted from it.
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://noema:noema@localhost:5432/noema_test
          REDIS_URL: redis://localhost:6379/0
          NOEMA_DEFAULT_PROVIDER: mock
          # Fail rather than silently skip the tenancy and auth tests if the database
          # is missing. A green run that quietly tested nothing is the failure mode
          # this whole job exists to prevent.
          NOEMA_REQUIRE_DB: "1"
        # The master key is generated per run rather than committed. A hardcoded one
        # is a high-entropy string in version control that secret scanning is right
        # to flag, and allowlisting it would teach the wrong reflex.
        #
        # The 80% gate is what the suite reaches with the database available. It was
        # 75% while the DB-backed tests were still missing.
        run: |
          export NOEMA_MASTER_KEY=$(python -c \
            "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
          uv run pytest --cov=noema --cov-report=term-missing --cov-fail-under=80

  web:
    name: web · lint · types · build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: the generated API types are current
        run: |
          npm run api:types
          git diff --exit-code src/lib/api-schema.ts \
            || { echo "api-schema.ts is stale — run npm run api:types" >&2; exit 1; }

      - run: npm run build

  security:
    name: security · deps & secrets
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run pip-audit --strict || true   # advisory until Phase 1 lockfiles settle
        working-directory: apps/api
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  compose:
    name: stack · docker compose from a clean clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exactly the Quick start in the README. If this job fails, the README lies.
      - name: docker compose up
        run: |
          cp .env.example .env
          python -c "import os,base64;print('NOEMA_MASTER_KEY=' + base64.b64encode(os.urandom(32)).decode())" >> .env
          python -c "import os,base64;print('NOEMA_SESSION_SECRET=' + base64.b64encode(os.urandom(32)).decode())" >> .env
          # The deterministic provider, so the smoke test exercises the real
          # streaming path without a model server or an API key.
          echo "NOEMA_DEFAULT_PROVIDER=mock" >> .env
          echo "NOEMA_EMBEDDING_PROVIDER=mock" >> .env
          docker compose up -d --build --wait --wait-timeout 300

      - name: the api is ready and reports its database healthy
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/ready | tee /tmp/ready.json
          python -c "import json,sys; d=json.load(open('/tmp/ready.json')); sys.exit(0 if d['database']=='ok' else 1)"

      - name: the migration ran and the schema is present
        run: |
          docker compose exec -T postgres psql -U noema -d noema -c "\dt" | tee /tmp/tables.txt
          grep -q notebooks /tmp/tables.txt
          docker compose exec -T postgres psql -U noema -d noema \
            -c "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -q vector

      - name: a notebook can be created end to end
        run: bash scripts/smoke.sh

      - name: the web app serves the landing page
        # Next's dev server compiles the first request, so this polls rather than
        # asserting on a cold container.
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000 | grep -qi noema; then
              echo "web ready after ${attempt}s"; exit 0
            fi
            sleep 2
          done
          echo "web did not serve the landing page within 60s" >&2
          exit 1

      - if: failure()
        run: |
          docker compose logs --no-color --tail 200
          # Whether the row is in the database at all separates a lost write from
          # one the API could not see.
          docker compose exec -T postgres psql -U noema -d noema \
            -c "SELECT id, owner_id, title, deleted_at FROM notes ORDER BY created_at DESC LIMIT 5"
          docker compose exec -T postgres psql -U noema -d noema \
            -c "SELECT count(*) AS open_transactions FROM pg_stat_activity WHERE state = 'idle in transaction'" 

      - if: always()
        run: docker compose down -v

      # Local mode claims nothing leaves the machine. That claim is worth exactly
      # as much as a test of it, so the containers are actually asked to reach the
      # internet and have to fail.
      - name: local mode has no route to the internet
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            up -d --build --wait --wait-timeout 300 api worker
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d proxy

          # nginx takes a moment to bind; poll rather than assert on a cold container.
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8000/health >/dev/null && break
            sleep 2
          done

          # Reachable through the one container on the boundary. A container on an
          # internal-only network cannot publish a port at all, so without the proxy
          # local mode would be private and unusable in equal measure.
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/api/v1/meta | tee /tmp/meta.json
          python -c "import json,sys; d=json.load(open('/tmp/meta.json')); sys.exit(0 if d['local'] else 1)"

          # An IP address, so this tests routing rather than DNS. Both containers,
          # because the worker is the one holding the uploaded documents.
          for service in api worker; do
            # A container that is not running would "fail to connect" for entirely
            # the wrong reason. The first version of this check passed on the worker
            # because the worker had never been started.
            docker compose -f docker-compose.yml -f docker-compose.local.yml \
              ps --status running --format '{{.Service}}' | grep -qx "$service" \
              || { echo "$service is not running; the egress check would be vacuous" >&2; exit 1; }

            if out=$(docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T "$service" \
                       python -c "import socket; socket.create_connection(('1.1.1.1', 443), 5)" 2>&1); then
              echo "$service reached the internet in local mode" >&2
              exit 1
            fi

            # And it has to fail because there is no route, not because python is
            # missing or the command was malformed.
            echo "$out" | grep -qiE "unreachable|timed out|refused" \
              || { echo "$service failed for the wrong reason: $out" >&2; exit 1; }
            echo "$service: no route out"
          done

      # Same lesson as the smoke test: a failure that prints nothing costs a whole
      # run to diagnose.
      - if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            logs --no-color --tail 100 proxy api
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            ps --format '{{.Name}}\t{{.Status}}'

      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
