name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api:
    name: api · lint · types · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

      - name: migrate
        env:
          DATABASE_URL: postgresql+asyncpg://noema:noema@localhost:5432/noema_test
        # Applying the migration against real Postgres with pgvector is the only way
        # to know it works; rendered SQL proves the Python runs, not that the server
        # accepts it. `alembic check` then fails if the models have drifted from it.
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://noema:noema@localhost:5432/noema_test
          REDIS_URL: redis://localhost:6379/0
          NOEMA_DEFAULT_PROVIDER: mock
          # Fail rather than silently skip the tenancy and auth tests if the database
          # is missing. A green run that quietly tested nothing is the failure mode
          # this whole job exists to prevent.
          NOEMA_REQUIRE_DB: "1"
        # The master key is generated per run rather than committed. A hardcoded one
        # is a high-entropy string in version control that secret scanning is right
        # to flag, and allowlisting it would teach the wrong reflex.
        run: |
          export NOEMA_MASTER_KEY=$(python -c \
            "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
          uv run pytest --cov=noema --cov-report=term-missing --cov-fail-under=75

  web:
    name: web · lint · types · build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: security · deps & secrets
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run pip-audit --strict || true   # advisory until Phase 1 lockfiles settle
        working-directory: apps/api
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  compose:
    name: stack · docker compose from a clean clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exactly the Quick start in the README. If this job fails, the README lies.
      - name: docker compose up
        run: |
          cp .env.example .env
          python -c "import os,base64;print('NOEMA_MASTER_KEY=' + base64.b64encode(os.urandom(32)).decode())" >> .env
          python -c "import os,base64;print('NOEMA_SESSION_SECRET=' + base64.b64encode(os.urandom(32)).decode())" >> .env
          docker compose up -d --build --wait --wait-timeout 300

      - name: the api is ready and reports its database healthy
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/ready | tee /tmp/ready.json
          python -c "import json,sys; d=json.load(open('/tmp/ready.json')); sys.exit(0 if d['database']=='ok' else 1)"

      - name: the migration ran and the schema is present
        run: |
          docker compose exec -T postgres psql -U noema -d noema -c "\dt" | tee /tmp/tables.txt
          grep -q notebooks /tmp/tables.txt
          docker compose exec -T postgres psql -U noema -d noema \
            -c "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -q vector

      - name: a notebook can be created end to end
        run: bash scripts/smoke.sh

      - name: the web app serves the landing page
        # Next's dev server compiles the first request, so this polls rather than
        # asserting on a cold container.
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000 | grep -qi noema; then
              echo "web ready after ${attempt}s"; exit 0
            fi
            sleep 2
          done
          echo "web did not serve the landing page within 60s" >&2
          exit 1

      - if: failure()
        run: docker compose logs --no-color --tail 200

      - if: always()
        run: docker compose down -v
