name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api:
    name: api · lint · types · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://noema:noema@localhost:5432/noema_test
          REDIS_URL: redis://localhost:6379/0
          NOEMA_MASTER_KEY: dGVzdC1rZXktZm9yLWNpLW9ubHktMzJieXRlcy0xMjM0
          NOEMA_DEFAULT_PROVIDER: mock
        # 75% is what the suite reaches without a database. The auth, credential and
        # repository paths are covered by the DB-backed suite in issue #8; raise this
        # gate to 85 when that lands.
        run: uv run pytest --cov=noema --cov-report=term-missing --cov-fail-under=75

  web:
    name: web · lint · types · build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: security · deps & secrets
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run pip-audit --strict || true   # advisory until Phase 1 lockfiles settle
        working-directory: apps/api
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
